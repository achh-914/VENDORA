<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Contributing to Vendora">
<title>Contributing to Vendora</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141f38"/><stop offset="1" stop-color="#0e1628"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#23324f"/></pattern>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="800" height="200" rx="14"/></clipPath>

<style>text{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif}.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style>
</defs>
<g clip-path="url(#card)">
<rect width="800" height="200" fill="url(#bg)"/>
<rect width="800" height="200" fill="url(#dots)"/>
<line x1="438" y1="92" x2="482" y2="92" stroke="#8d9bb8" stroke-width="1.6" opacity="0.7" class="flow"/>
<line x1="518" y1="92" x2="562" y2="92" stroke="#8d9bb8" stroke-width="1.6" opacity="0.7" class="flow"/>
<line x1="598" y1="92" x2="642" y2="92" stroke="#8d9bb8" stroke-width="1.6" opacity="0.7" class="flow"/>
<line x1="678" y1="92" x2="722" y2="92" stroke="#8d9bb8" stroke-width="1.6" opacity="0.7" class="flow"/>
<circle cx="420" cy="92" r="17" fill="#182238" stroke="#2dd4bf" stroke-width="2"/>
<text x="420" y="97" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">1</text>
<text x="420" y="132" font-size="12" fill="#8d9bb8" text-anchor="middle">Issue</text>
<circle cx="500" cy="92" r="17" fill="#182238" stroke="#2dd4bf" stroke-width="2"/>
<text x="500" y="97" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">2</text>
<text x="500" y="132" font-size="12" fill="#8d9bb8" text-anchor="middle">Branch</text>
<circle cx="580" cy="92" r="17" fill="#182238" stroke="#2dd4bf" stroke-width="2"/>
<text x="580" y="97" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">3</text>
<text x="580" y="132" font-size="12" fill="#8d9bb8" text-anchor="middle">Pull request</text>
<circle cx="660" cy="92" r="17" fill="#182238" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
<text x="660" y="97" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4</text>
<text x="660" y="132" font-size="12" fill="#e8edf7" text-anchor="middle">Review</text>
<circle cx="740" cy="92" r="17" fill="#182238" stroke="#2dd4bf" stroke-width="2"/>
<text x="740" y="97" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">5</text>
<text x="740" y="132" font-size="12" fill="#8d9bb8" text-anchor="middle">Merge</text>
<circle cx="660" cy="92" r="17" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0"><animate attributeName="r" values="17;30" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/></circle>
<text x="660" y="152" font-size="11" fill="#fbbf24" text-anchor="middle">a person decides</text>
<circle r="6" fill="#e8edf7" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M420,92 L740,92" keyPoints="0;0.75;0.75;1" keyTimes="0;0.4;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" repeatCount="indefinite"/></circle>
</g>
<rect x="0.75" y="0.75" width="798.5" height="198.5" rx="13.5" fill="none" stroke="#3a4e78" stroke-width="1.5"/>
<text x="40" y="96" font-size="36" font-weight="700" fill="#e8edf7">Contributing</text>
<text x="40" y="128" font-size="16" fill="#8d9bb8">Synthetic data only. A person approves.</text>
</svg>