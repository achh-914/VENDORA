name: schema

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vendora
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: vendora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vendora -d vendora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U vendora -d vendora -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Check table count
        run: |
          n=$(psql -h localhost -U vendora -d vendora -tAc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          echo "tables: $n"
          test "$n" -eq 13

      - name: Check audit log is append-only
        run: |
          psql -h localhost -U vendora -d vendora -v ON_ERROR_STOP=1 -c "INSERT INTO audit_log(actor_type, actor, event_type) VALUES ('system','ci','smoke');"
          out=$(psql -h localhost -U vendora -d vendora -c "DELETE FROM audit_log;" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "append-only"
